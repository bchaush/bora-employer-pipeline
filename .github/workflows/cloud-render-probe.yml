name: Cloud Render Environment Probe

on:
  push:
    branches:
      - ops/cloud-render-probe-v1

permissions:
  contents: read

jobs:
  ubuntu24:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe host
        shell: bash
        run: |
          set -euxo pipefail
          cat /etc/os-release
          uname -a
          command -v python3 || true
          python3 --version || true
          if [ -x /usr/local/python/3.14.2/bin/python3.14 ]; then
            /usr/local/python/3.14.2/bin/python3.14 --version
            sha256sum /usr/local/python/3.14.2/bin/python3.14
          else
            echo "EXACT_OPERATOR_PYTHON=ABSENT"
          fi
          command -v libreoffice || true
          command -v bwrap || true
          dpkg-query -W -f='${Package} ${Version}\n' fonts-liberation libreoffice-core-nogui libreoffice-writer-nogui bubblewrap 2>/dev/null || true

  devcontainer_universal:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/devcontainers/universal:2
    steps:
      - name: Probe universal container
        shell: bash
        run: |
          set -euxo pipefail
          cat /etc/os-release
          uname -a
          if [ -x /usr/local/python/3.14.2/bin/python3.14 ]; then
            /usr/local/python/3.14.2/bin/python3.14 --version
            sha256sum /usr/local/python/3.14.2/bin/python3.14
            python_path=/usr/local/python/3.14.2/bin/python3.14
          else
            echo "EXACT_OPERATOR_PYTHON=ABSENT"
            python_path="$(command -v python3 || true)"
          fi
          test -n "$python_path" && "$python_path" --version || true
          command -v libreoffice || true
          command -v bwrap || true
          dpkg-query -W -f='${Package} ${Version}\n' fonts-liberation libreoffice-core-nogui libreoffice-writer-nogui bubblewrap 2>/dev/null || true